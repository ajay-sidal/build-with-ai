# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Vercel Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  vercel-validate:
    name: Validate `npx vercel` availability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install minimal deps
        run: npm ci --silent

      - name: Check `npx vercel` runs
        run: |
          echo "Testing npx vercel availability..."
          npx vercel --version || { echo "npx vercel not available"; exit 1; }
          echo "npx vercel available"
          # If Vercel token is present, attempt a harmless token check
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN present - validating token via 'vercel whoami'"
            npx vercel whoami --token "$VERCEL_TOKEN" || echo "vercel whoami failed (token may be invalid)"
          else
            echo "VERCEL_TOKEN not present; skipping token validation"
          fi

  deploy:
    name: Build, Test and Deploy
    needs: vercel-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test -- --run

      - name: Build application
        run: npm run build

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking Vercel environment variables..."
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set in runner environment. Skipping deploy."
            exit 0
          fi
          echo "Deploying to Vercel preview..."
          npx vercel --token "$VERCEL_TOKEN" --confirm --prebuilt --scope "$VERCEL_ORG_ID" --yes || true

      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Checking Vercel environment variables..."
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set in runner environment. Skipping deploy."
            exit 0
          fi
          echo "Deploying to Vercel production..."
          npx vercel --token "$VERCEL_TOKEN" --confirm --prod --prebuilt --scope "$VERCEL_ORG_ID" --yes || true
